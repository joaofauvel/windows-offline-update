[project]
name = "wuo"
version = "0.2.0"
description = "Find Windows updates and prepare them for offline servicing"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
win-offline-update = "win_offline_update.cli:main"
wuo = "win_offline_update.cli:main"

[project.urls]
Repository = "https://github.com/joaofauvel/windows-offline-update"

[tool.hatch.build.targets.wheel]
packages = ["src/win_offline_update"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/hooks/usb4.toml", "/pyproject.toml", "/src/win_offline_update"]

[dependency-groups]
dev = ["mypy>=1.19", "pytest>=9", "ruff>=0.15"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.15"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
